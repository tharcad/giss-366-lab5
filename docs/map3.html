<!DOCTYPE html>
<html>
<head>
    <title>My Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script type="module">
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-106.1, 34.3],   // [lng, lat]
            zoom: 5.5
        });
        //Part A
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.on("load", () => {
            map.addSource("counties-source", {
                type: "geojson",
                data: "data/nm_counties.geojson"
            });
            // Add a layer for the county fills
            map.addLayer({
                id: "counties-fill",
                type: "fill",
                source: "counties-source",
                paint: {
                    "fill-color": "#088",
                    "fill-opacity": 0.4
                }
            });
            // Add a layer for the county outlines
            map.addLayer({
                id: "counties-outline",
                type: "line",
                source: "counties-source",
                paint: {
                    "line-color": "#000",
                    "line-width": 1
                }
            });
        });
        window.map = map;
    </script>
</body>
</html>
